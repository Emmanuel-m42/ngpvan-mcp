[project]
name = "ngpvan-mcp"
version = "0.1.0"
description = "An MCP server for the NGP VAN API: read-only by default, personal data kept out of the model, every call audited."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Emmanuel-m42", email = "mammahemmanuel42@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
gcp = ["google-cloud-secret-manager>=2.20"]

[project.scripts]
ngpvan-mcp = "ngpvan_mcp.cli:main"
ngpvan-mcp-evals = "ngpvan_mcp.evals.runner:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
